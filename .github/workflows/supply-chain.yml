name: Supply Chain Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sbom:
    name: SBOM and provenance artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install

      - name: Generate CycloneDX SBOM
        run: make sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom.cdx.json

      - name: Install Cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SBOM with keyless Cosign
        if: github.event_name == 'release'
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/sbom.cdx.json.sig \
            --output-certificate artifacts/sbom.cdx.json.pem \
            artifacts/sbom.cdx.json

      - name: Upload signed provenance files
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-signature
          path: |
            artifacts/sbom.cdx.json.sig
            artifacts/sbom.cdx.json.pem
